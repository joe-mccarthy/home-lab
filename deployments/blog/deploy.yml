---
# This playbook is responsible for deploying the blog service to the Docker Swarm cluster.
# It targets the manager group and executes deployment tasks on one selected manager host.

- name: Deploy Blog  # A descriptive name for the playbook
  hosts: manager  # Specifies the target manager host group.
  order: shuffle  # Select a manager without always preferring the first inventory host.
  become: true       # Ensures the playbook runs with elevated privileges (e.g., sudo).
  vars:
    # Use one selected manager host for deployment to avoid `run_once` strategy caveats.
    blog_deploy_host: "{{ ansible_play_hosts_all | first }}"

  tasks:
    - name: Deploy Blog stack
      ansible.builtin.include_role:
        name: deploy
      when: inventory_hostname == blog_deploy_host
