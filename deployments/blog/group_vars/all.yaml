blog:
  image: "{{ vault_blog_image }}"  # Docker image for the blog service, sourced from Ansible Vault
  port: "{{ (vault_blog_ports | default({})).app_internal | default('80') }}"  # Internal port for the blog service, defaulting to 80 if not set in Vault

# Optional explicit image pin for the blog service (override vault_blog_image if desired)
# blog_image: "ghcr.io/<owner>/<repo>:<pinned-version>"
