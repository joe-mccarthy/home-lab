---

- name: Deploy Gitea Runners
  hosts: manager  # Target the manager group instead of hard-coding a specific index.
  order: shuffle  # Select a manager without always preferring the first inventory host.
  become: true  # Execute tasks with elevated privileges (sudo) to ensure proper permissions.
  tasks:
    - name: Deploy Gitea runners
      ansible.builtin.include_role:
        name: runner_deploy
      run_once: true
