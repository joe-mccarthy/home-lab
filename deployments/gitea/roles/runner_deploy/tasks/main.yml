---
# This task file is responsible for deploying Gitea runners (act_runner) using Docker Swarm.
# It ensures that Docker and docker-compose are installed and running, removes any existing services,
# sets up the required directory structure, deploys the runner stack, and cleans up temporary files.

- name: Run shared Docker prerequisites and cleanup
  ansible.builtin.include_role:
    name: docker_prereqs_and_stop
  vars:
    docker_prereqs_and_stop_services_to_stop:
      - gitea_runner

- name: Set up Gitea runner directory
  ansible.builtin.file:
    path: /home/docker-compose/gitea-runner # The path to the directory to be created.
    state: directory  # Ensure the path is a directory.
    mode: '0755'  # Set the directory permissions (read, write, execute for owner; read and execute for others).
    owner: nobody  # Set the directory owner to `nobody`.
    group: nogroup  # Set the directory group to `nogroup`.
  # This task creates the directory structure required for the Gitea runner deployment.

- name: Copy compose from template to host
  ansible.builtin.template:
    src: "templates/runners/docker-compose.yml"  # Path to the Jinja2 template for the docker-compose file.
    dest: "/home/docker-compose/gitea-runner/docker-compose.yaml"  # Destination path for the docker-compose file.
    mode: '0755'  # Set the file permissions (read, write, execute for owner; read and execute for others).
    owner: nobody  # Set the file owner to `nobody`.
    group: nogroup  # Set the file group to `nogroup`.
  # This task copies the docker-compose template to the target system, ensuring it is ready for runner deployment.

- name: Deploy Gitea Runner stack
  community.docker.docker_stack:
    name: gitea
    compose:
      - /home/docker-compose/gitea-runner/docker-compose.yaml
    state: present
    # The `docker stack deploy` command deploys the runner stack using the specified compose file.
    # - `-c`: Specifies the path to the docker-compose file.
    # - `gitea`: The name of the stack to deploy (contains the Gitea runners).
  register: runner_deploy_swarm_check  # Store the output of the command in the `swarm_check` variable.
  changed_when: false  # Ensure this task does not mark the playbook as "changed."
  # This task deploys the Gitea runner stack to the Docker Swarm cluster.

- name: Delete compose directory
  ansible.builtin.file:
    path: /home/docker-compose
    state: absent
  # This task cleans up the temporary files and directories created during the deployment process.

# Notes:
# - Ensure that Docker and Docker Swarm are properly configured on the target system before running this playbook.
# - The `docker-compose.yml` template should define the Gitea act_runner service with proper environment variables.
# - The runner requires GITEA_INSTANCE_URL and GITEA_RUNNER_REGISTRATION_TOKEN to be configured in group_vars.
# - The registration token should be encrypted in vault_gitea.runner_token and referenced in group_vars/all.yml.
# - The cleanup step (`delete compose directory`) is optional and can be removed if the compose files need to be retained.
# - Use caution when setting permissions (`0755`) and ownership (`nobody:nogroup`) to avoid security risks.
# - The runner connects to the main Gitea instance to provide CI/CD capabilities for repositories.
# - Each runner instance will be deployed globally across all swarm nodes with unique hostnames.
# - Always test the deployment in a staging environment before applying it to production.
