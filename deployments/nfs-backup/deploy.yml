---
# NFS BACKUP DEPLOYMENT
#
# Install, validate, and activate the backup jobs on the one authoritative NFS
# host. This deployment uses only the local Docker daemon and systemd.
- name: Deploy NFS Backup Jobs
  hosts: nfs_servers
  become: true
  any_errors_fatal: true
  gather_facts: false

  pre_tasks:
    # Multiple source hosts would run duplicate backups under the same Restic
    # hostname, path, and tag.
    - name: Require one authoritative NFS server
      ansible.builtin.assert:
        that:
          - groups['nfs_servers'] | length == 1
        fail_msg: The deployment requires exactly one host in nfs_servers

  tasks:
    # Preparation pauses existing timers, refuses to replace files while a job
    # is active, installs the runner, and validates the repository.
    - name: Prepare scheduled one-shot backup jobs
      ansible.builtin.include_role:
        name: deploy_backup

    # Activate timers only after all installation and validation tasks succeed.
    - name: Enable scheduled one-shot backup jobs
      ansible.builtin.include_role:
        name: deploy_backup
        tasks_from: enable_timers
