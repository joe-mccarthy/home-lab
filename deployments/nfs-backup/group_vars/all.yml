---
nfs_backup:
  # Repository encryption key — loss of this key makes all backups permanently inaccessible
  encryption_key: "{{ vault_nfs_encryption_key }}"

  # S3-compatible storage backend
  s3:
    bucket: "{{ vault_nfs_s3_bucket }}"       # S3 bucket URL (e.g., s3:https://endpoint/bucket-name)
    region: "{{ vault_nfs_s3_region }}"       # AWS/S3 region (e.g., us-east-1)
    key_id: "{{ vault_nfs_s3_key_id }}"       # S3 access key ID
    access_key: "{{ vault_nfs_s3_access_key }}" # S3 secret access key

  # Pinned image tag for reproducible deployments
  version: "1.8.2"

# Notes:
# - All vault_* variables must be defined and encrypted in Ansible Vault.
# - To edit encrypted variables: ansible-vault edit group_vars/all.yml
# - S3 credentials should be scoped to minimum required permissions:
#   s3:ListBucket, s3:PutObject, s3:GetObject, s3:DeleteObject
# - Store a secure offline copy of encryption_key — there is NO recovery if it is lost.
