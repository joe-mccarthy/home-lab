---
# Group variables used by the Paperless deployment playbooks.
#
# These values primarily source sensitive information from an Ansible Vault
# variable file (`vault_paperless`). This keeps secrets out of version control.
#
# The naming here matches the variables expected by the role that renders
# `docker-compose.yaml` (so the Play uses them directly).

paperless:
  volumes:
    paperless:
      media: "{{ vault_paperless.volumes.paperless.media }}"
      data: "{{ vault_paperless.volumes.paperless.data }}"
      consume: "{{ vault_paperless.volumes.paperless.consume }}"
      export: "{{ vault_paperless.volumes.paperless.export }}"
    broker: "{{ vault_paperless.volumes.broker }}"
  ports:
    paperless: "{{ vault_paperless.ports.paperless }}"
    tika: "{{ vault_paperless.ports.tika }}"
    broker: "{{ vault_paperless.ports.broker }}"
    gotenberg: "{{ vault_paperless.ports.gotenberg }}"