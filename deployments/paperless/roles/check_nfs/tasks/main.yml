---
# Role: check_nfs
# Purpose: Ensure the NFS-backed filesystem has the directories required by
# the Paperless stack. This is run prior to deploying Paperless so the services
# can mount predictable directories for storage and message broker data.
#
# Notes:
#   - This role assumes the NFS volume is already mounted at `/mnt/nfs`.
#   - Permissions are set wide-open (0777) to allow the `nobody:nogroup` user
#     used by many containers to read/write without permission issues.
#   - The directory structure mirrors the expected volume mounts in the
#     Paperless docker-compose stack.

- name: Create Root Paperless Directory
  ansible.builtin.file:
    path: /mnt/nfs/docker/paperless
    state: directory
    mode: 0777
    owner: nobody
    group: nogroup
  # This is the base root under which all Paperless data lives. It should exist
  # before creating sub-directories.

- name: Create Paperless Directories
  file:
    # These directories are consumed by the Paperless stack (media, data, broker)
    # and are mounted into the containers to persist state and communicate.
    path: "/mnt/nfs/docker/paperless/{{ item }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: 0777
  loop:
    - media   # where scanned/imported documents are stored
    - data    # Paperless app data
    - consume # input queue for document ingestion
    - export  # export output directory
    - broker  # message broker in this case, used by the Redis service


