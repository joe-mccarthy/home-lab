---
# Role: deploy_paperless
# Purpose: Install dependencies and deploy the Paperless stack using a Docker Compose
# definition rendered from a template.
#
# This role is intended to run on the host(s) that will run the Paperless services.
# It performs the following high-level actions:
#   1) Ensures docker-compose is installed (for authoring / future tooling)
#   2) Ensures the Docker daemon is running/enabled
#   3) Creates a local directory for the rendered compose file
#   4) Renders the compose file from a Jinja2 template in this role
#   5) Removes any pre-existing Paperless swarm services to avoid stale state
#   6) Deploys the stack via `docker stack deploy`
#   7) Cleans up the temporary deployment directory
#
# Notes:
#   - The compose template lives at `roles/deploy_paperless/templates/docker-compose.yaml`.
#   - The stack name is hard-coded as `paperless` (Docker Swarm).
#   - This role does not initialize or manage the swarm itself; it assumes the node
#     is already part of a Swarm.
#   - The directory `/home/docker-compose/paperless` is used as a working location.
#     It is removed at the end to avoid leaving artifacts.

- name: Run shared Docker prerequisites and cleanup
  ansible.builtin.include_tasks: "{{ role_path }}/../../../_shared/roles/docker_prereqs_and_stop/tasks/main.yml"
  vars:
    docker_prereqs_and_stop_services_to_stop:
      - paperless_paperless
      - paperless_paperless-broker
      - paperless_paperless-tika
      - paperless_paperless-gotenberg

- name: Create local deployment directory
  ansible.builtin.file:
    path: /home/docker-compose/paperless
    state: directory
    mode: '0755'
    owner: nobody
    group: nogroup

- name: Deploy Docker Compose stack definition from template
  ansible.builtin.template:
    src: "templates/docker-compose.yaml"
    dest: "/home/docker-compose/paperless/docker-compose.yaml"
    mode: '0755'
    owner: nobody
    group: nogroup

# The following task removes any existing Docker Swarm services that overlap with
# the ones defined in our compose file. This avoids issues where the stack deploy would
# otherwise try to update services that are already in a conflicting state.


# Deploy the stack. Using a plain command to allow more control over how results
# are interpreted and to avoid Ansible trying to parse json output (as some Docker
# versions emit non-json messages on stdout).
- name: Deploy Paperless stack to Docker Swarm
  community.docker.docker_stack:
    name: paperless
    compose:
      - /home/docker-compose/paperless/docker-compose.yaml
    state: present
  register: deploy_paperless_swarm_deployment_result
  # The docker CLI can exit with 0 even when no changes occur. Mark this task as
  # not-changed so that the playbook doesn't always report changes just because
  # the command ran.
  changed_when: false

# Clean up the temporary working directory so we don't leave host artifacts behind.
- name: Remove temporary deployment directory
  ansible.builtin.file:
    path: /home/docker-compose
    state: absent
