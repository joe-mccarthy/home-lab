services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
      - gotenberg
      - tika
    ports:
      - "8000:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.27
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped

volumes:
  redisdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joseph/paperless-test/redis

  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joseph/paperless-test/data

  media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joseph/paperless-test/media

  export:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joseph/paperless-test/export

  consume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joseph/paperless-test/consume