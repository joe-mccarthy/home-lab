---
# This task file is responsible for deploying the Portainer stack using Docker Swarm.
# It performs the following steps:
# 1. Renders the Portainer compose template on the manager node.
# 2. Deploys or reconciles the Portainer stack in Docker Swarm.
# 3. Removes temporary compose artifacts after deployment.

- name: Run shared Docker prerequisites and cleanup
  ansible.builtin.include_role:
    name: docker_prereqs_and_stop
  vars:
    docker_prereqs_and_stop_services_to_stop:
      - portainer_portainer
      - portainer_agent
  # This task includes a shared role that ensures Docker and Docker Compose are installed and running.
  # It also removes any existing Docker Swarm services related to Portainer to ensure a clean deployment.

- name: Iterate over secrets defined in group variables
  community.docker.docker_secret:
    name: "{{ item.key }}"
    data: "{{ item.value }}"
    force: true
  with_dict:
    portainer_admin_password: "{{ portainer.admin_password }}"
  no_log: true
  # This task creates Docker secrets for the Portainer deployment using the variables defined in the group variables file.
  # The `no_log: true` option ensures that sensitive data (e.g., secret values) is not logged during playbook execution.

- name: Deploy Services
  ansible.builtin.include_role:
    name: copy_and_deploy
  vars:
    copy_and_deploy_stack_name: portainer

- name: Clean up compose directory
  ansible.builtin.include_role:
    name: cleanup

# Notes:
# - Ensure that Docker and Docker Swarm are properly configured on the target system before running this playbook.
# - The compose template should include all services, networks, and secrets required by Portainer.
# - Keep `/home/docker-compose` if you need post-deploy troubleshooting artifacts.
# - Validate `nobody:nogroup` ownership against your host and NFS permission model.
