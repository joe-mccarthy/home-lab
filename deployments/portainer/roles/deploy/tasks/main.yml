---
# This task file is responsible for deploying the Portainer stack using Docker Swarm.
# It performs the following steps:
# 1. Renders the Portainer compose template on the manager node.
# 2. Deploys or reconciles the Portainer stack in Docker Swarm.
# 3. Removes temporary compose artifacts after deployment.

- name: Copy compose from template to host
  ansible.builtin.template:
    src: "templates/docker-compose.yaml"  # Jinja2 source for the stack definition.
    dest: "/home/docker-compose/portainer/docker-compose.yaml"  # Rendered compose file consumed by docker_stack.
    mode: '0755'  # Readable by runtime processes; writable by owner.
    owner: nobody  # Aligns with shared NFS ownership used by this project.
    group: nogroup
  # Render the compose file before deploying the stack.

- name: Deploy Portainer stack
  community.docker.docker_stack:
    name: portainer
    compose:
      - /home/docker-compose/portainer/docker-compose.yaml
    state: present
  register: deploy_swarm_check  # Captures module output for debugging.
  changed_when: false  # Keeps output stable for repeated deploy runs.
  # Deploy or update the Portainer stack on the Swarm manager.

- name: Delete compose directory
  ansible.builtin.file:
    path: /home/docker-compose
    state: absent
  # Clean up temporary deployment files.

# Notes:
# - Ensure that Docker and Docker Swarm are properly configured on the target system before running this playbook.
# - The compose template should include all services, networks, and secrets required by Portainer.
# - Keep `/home/docker-compose` if you need post-deploy troubleshooting artifacts.
# - Validate `nobody:nogroup` ownership against your host and NFS permission model.
